name: Apply Company Brain V2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-company-brain-v2.js'
      - '.github/workflows/apply-company-brain-v2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: "${{ !contains(github.event.head_commit.message, 'chore: apply Company Brain V2') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply upgrade
        run: node scripts/upgrade-company-brain-v2.js
      - name: Commit upgraded UI
        run: |
          if git diff --quiet -- site/index.html; then
            echo "No UI changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "chore: apply Company Brain V2"
          git push origin HEAD:main
