name: Company Brain CI

on:
  push:
    paths:
      - "cloud/CompanyBrain.Api/**"
      - ".github/workflows/company-brain.yml"
  pull_request:
    paths:
      - "cloud/CompanyBrain.Api/**"
      - ".github/workflows/company-brain.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/CompanyBrain.Api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-restore --output ./publish
