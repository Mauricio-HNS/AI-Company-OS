name: Validate AI Company OS backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
  pull_request:
    paths:
      - "server/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: node --check server.js
      - name: Application syntax check
        run: node --check app.js
      - name: Test
        run: npm test
